<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Visualização interativa do toro pinçado e dos campos vetoriais induzidos.">
<title>Toro pinçado — Laboratório Visual de Geometria</title>
<style>
:root{
  color-scheme:light;
  --bg:#fff;--panel:rgba(248,250,253,.96);--panel-solid:#f7f9fc;
  --line:#dce3ec;--text:#182230;--muted:#64748b;--accent:#285d91;
  --control:#fff;--control-hover:#edf3f9;--shadow:0 12px 34px rgba(20,35,55,.12);
}
body.contrast{
  color-scheme:dark;
  --bg:#080b10;--panel:rgba(13,22,34,.96);--panel-solid:#111925;
  --line:#46566b;--text:#f5f8fc;--muted:#c1cede;--accent:#68d9ff;
  --control:#1a2635;--control-hover:#26384c;--shadow:0 12px 34px #0008;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{position:relative;width:100%;height:100%;height:100dvh;background:var(--bg);transition:background .2s,color .2s}
header{
 position:absolute;top:0;left:0;right:0;height:62px;z-index:4;display:flex;
 align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(12px,3vw,34px);
 background:var(--bg);border-bottom:1px solid var(--line)
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;color:var(--text);text-decoration:none;font-size:13px;font-weight:750}
.brand-mark{width:30px;height:30px;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:17px;flex:none}
.brand small{display:block;color:var(--muted);font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.head-actions{display:flex;gap:7px;align-items:center}
button,a.navbtn{font:inherit;color:var(--text);background:var(--control);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;text-decoration:none;cursor:pointer;white-space:nowrap}
button:hover,a.navbtn:hover{background:var(--control-hover);border-color:var(--accent)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view{position:absolute;inset:62px 0 164px;touch-action:none}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#panel{
 position:absolute;z-index:5;left:50%;bottom:10px;transform:translateX(-50%);
 width:min(1000px,calc(100% - 24px));padding:12px 15px;
 background:var(--panel);border:1px solid var(--line);border-radius:15px;
 backdrop-filter:blur(16px);box-shadow:var(--shadow)
}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.section{font-size:12px;font-weight:750}
.buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:10px;color:var(--muted);font-weight:650}
.field select{width:100%;min-width:0}
select{font:inherit;color:var(--text);background:var(--control);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:11px}
.range-head{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.range-head output{color:var(--text);font-variant-numeric:tabular-nums;font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.legend{display:flex;flex-wrap:wrap;gap:11px;margin-top:9px;font-size:10px;color:var(--muted)}
.key{display:flex;align-items:center;gap:5px}
.swatch{width:8px;height:8px;border-radius:50%}
#status{display:none;position:absolute;inset:62px 0 0;z-index:10;align-items:center;justify-content:center;padding:20px;background:color-mix(in srgb,var(--bg) 90%,transparent)}
#status.show{display:flex}
.message{max-width:550px;padding:18px;background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;font-size:13px;line-height:1.55;box-shadow:var(--shadow)}
.message p{color:var(--muted)}
@media(max-width:680px){
 header{height:56px;padding:0 9px}
 .brand{font-size:11px;gap:7px}.brand-mark{width:26px;height:26px}
 .brand small{font-size:8px}
 .head-actions{gap:4px}
 button,a.navbtn{padding:6px 7px;font-size:9px}
 #view{inset:56px 0 280px}
 #panel{bottom:6px;width:calc(100% - 12px);padding:9px;border-radius:12px}
 .top{align-items:flex-start;margin-bottom:7px}
 .section{font-size:11px}
 .buttons{justify-content:flex-end}
 .controls{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 10px}
 .field{gap:3px}
 .legend{gap:7px;margin-top:7px;font-size:9px}
 #status{inset:56px 0 0}
}
@media(max-height:560px) and (min-width:681px){
 #view{inset:56px 0 130px}
 #panel{padding:7px 10px;bottom:5px}
 .controls{gap:5px 10px}
 .legend{margin-top:5px}
}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="app">
<header>
 <a class="brand" href="../../">
  <span class="brand-mark">∿</span>
  <span>Laboratório Visual de Geometria<small>Geometria · Topologia · Visualização</small></span>
 </a>
 <div class="head-actions">
  <a class="navbtn" href="../">← Superfícies</a>
  <button id="theme" type="button">Alto contraste</button>
 </div>
</header>

<div id="view" aria-label="Visualização 3D interativa do toro pinçado"></div>

<section id="panel">
 <div class="top">
  <div class="section">Toro pinçado · parâmetros e campos</div>
  <div class="buttons">
   <button id="reset" type="button">↺ Reiniciar</button>
   <button id="fullscreen" type="button">⛶ Tela inteira</button>
   <button id="open" type="button" hidden>Abrir em nova aba ↗</button>
  </div>
 </div>
 <div class="controls">
  <div class="field"><label for="k">Número de pinçamentos k</label><select id="k">
   <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
  </select></div>
  <div class="field"><label for="density">Densidade do campo vetorial</label><input id="density" type="range" min="4" max="40" step="2" value="14"><span class="range-head"><span>Esparso</span><output id="density-out">14</output></span></div>
  <div class="field"><label for="tmax">Comprimento da curva integral t<sub>max</sub></label><input id="tmax" type="range" min="0" max="50" step=".5" value="10"><span class="range-head"><span>0</span><output id="tmax-out">10.0</output></span></div>
  <div class="field"><label for="l1">λ₁</label><select id="l1"><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option><option value="sqrt2">√2</option><option value="pi">π</option><option value="e">e</option></select></div>
  <div class="field"><label for="l2">λ₂</label><select id="l2"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="sqrt2">√2</option><option value="pi" selected>π</option><option value="e">e</option></select></div>
  <div class="field"><label for="field-mode">Exibir campo vetorial</label><select id="field-mode"><option value="none">Nenhum</option><option value="x">Campo f_*X (vermelho)</option><option value="y">Campo f_*Y (azul)</option><option value="both" selected>Ambos</option></select></div>
  <div class="field"><label for="flow-mode">Exibir curvas integrais</label><select id="flow-mode"><option value="none">Nenhum</option><option value="x">Curva integral de f_*X (vermelho)</option><option value="y">Curva integral de f_*Y (azul)</option><option value="both" selected>Ambos</option></select></div>
 </div>
 <div class="legend">
  <span class="key"><i class="swatch" style="background:#f59a23"></i>Toro pinçado</span>
  <span class="key"><i class="swatch" style="background:#f05252"></i>f_*X e fluxo X</span>
  <span class="key"><i class="swatch" style="background:#559aff"></i>f_*Y e fluxo Y</span>
  <span>Arraste para girar · roda/pinça para zoom</span>
 </div>
</section>

<div id="status"><div class="message"><strong>Não foi possível iniciar a visualização 3D.</strong><p id="err"></p></div></div>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const $=id=>document.getElementById(id), PI=Math.PI, TAU=2*Math.PI, R=2;
function error(msg){$('err').textContent=msg;$('status').classList.add('show');}
const scene=new THREE.Scene();
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.setClearColor(0xffffff,1);
scene.background=new THREE.Color(0xffffff);
const camera=new THREE.PerspectiveCamera(43,1,.05,1000);
camera.position.set(5.4,4.2,6.4);
const view=$('view');
view.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=3;controls.maxDistance=30;controls.target.set(0,0,0);
scene.add(new THREE.HemisphereLight(0xd5eaff,0x5c6674,2));
const light=new THREE.DirectionalLight(0xffffff,2.3);light.position.set(4,7,6);scene.add(light);
const rim=new THREE.DirectionalLight(0x609dff,1.1);rim.position.set(-5,1,-5);scene.add(rim);
const torusMaterial=new THREE.MeshStandardMaterial({color:'#f59a23',roughness:.62,metalness:.04,side:THREE.DoubleSide,transparent:true,opacity:.88});
let torusMesh=null;
const xField=new THREE.Group(),yField=new THREE.Group();
let xFlow=null,yFlow=null,xArrow=null,yArrow=null;
scene.add(xField,yField);
const axes=new THREE.AxesHelper(3.2);axes.material.transparent=true;axes.material.opacity=.25;scene.add(axes);

function wrapAngle(a){return ((a%TAU)+TAU)%TAU;}
function map(theta,phi,k){
 const g=R+Math.sin(k*theta/2)*Math.cos(phi);
 return new THREE.Vector3(g*Math.cos(theta),g*Math.sin(theta),Math.sin(k*theta/2)*Math.sin(phi));
}
function derivatives(theta,phi,k){
 const q=k*theta/2,sq=Math.sin(q),cq=Math.cos(q),cp=Math.cos(phi),sp=Math.sin(phi),g=R+sq*cp;
 const dxth=(k/2*cq*cp)*Math.cos(theta)-g*Math.sin(theta);
 const dyth=(k/2*cq*cp)*Math.sin(theta)+g*Math.cos(theta);
 const dzth=(k/2*cq)*sp;
 const dxph=-sq*sp*Math.cos(theta),dyph=-sq*sp*Math.sin(theta),dzph=sq*cp;
 return {theta:new THREE.Vector3(dxth,dyth,dzth),phi:new THREE.Vector3(dxph,dyph,dzph)};
}
function fieldVector(theta,phi,k,l1,l2,type){
 const d=derivatives(theta,phi,k);
 return type==='x'?d.theta.multiplyScalar(l1).add(d.phi.multiplyScalar(l2)):d.theta.multiplyScalar(-l2).add(d.phi.multiplyScalar(l1));
}
function disposeTree(obj){
 if(!obj)return;
 obj.traverse(child=>{
  child.geometry?.dispose();
  if(Array.isArray(child.material))child.material.forEach(m=>m.dispose());
  else if(child.material)child.material.dispose();
 });
}
function clearGroup(group){
 while(group.children.length){const obj=group.children[0];group.remove(obj);disposeTree(obj);}
}
function disposeObject(obj){if(!obj)return;obj.parent?.remove(obj);disposeTree(obj);}
function makeTube(points,color,radius=.012){
 if(points.length<2)return null;
 const distinct=points.some((p,i)=>i>0&&p.distanceTo(points[0])>1e-7);
 if(!distinct)return null;
 const curve=new THREE.CatmullRomCurve3(points,false,'centripetal');
 return new THREE.Mesh(new THREE.TubeGeometry(curve,Math.max(100,points.length),radius,6,false),new THREE.MeshStandardMaterial({color,roughness:.48,metalness:.03}));
}
function addArrow(group,pos,vec,color,scale=.2,radius=.025){
 const dir=vec.clone(),len=dir.length()*scale;
 if(!Number.isFinite(len)||len<1e-8)return;
 dir.normalize();
 const arrow=new THREE.ArrowHelper(dir,pos,len,color,Math.min(.11,len*.34),Math.min(radius,len*.12));
 group.add(arrow);
}
function buildSurface(k){
 if(torusMesh){scene.remove(torusMesh);torusMesh.geometry.dispose();}
 const n=150,m=100,positions=[],indices=[];
 for(let i=0;i<=n;i++)for(let j=0;j<=m;j++){
  const p=map(TAU*i/n,TAU*j/m,k);positions.push(p.x,p.y,p.z);
 }
 for(let i=0;i<n;i++)for(let j=0;j<m;j++){
  const a=i*(m+1)+j,b=a+m+1;indices.push(a,b,a+1,b,b+1,a+1);
 }
 const geo=new THREE.BufferGeometry();
 geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
 geo.setIndex(indices);geo.computeVertexNormals();
 torusMesh=new THREE.Mesh(geo,torusMaterial);scene.add(torusMesh);
}
function readLambda(v){return v==='sqrt2'?Math.SQRT2:v==='pi'?Math.PI:v==='e'?Math.E:Number(v);}
function getParams(){
 return {k:Number($('k').value),a:Number($('density').value),tmax:Number($('tmax').value),l1:readLambda($('l1').value),l2:readLambda($('l2').value),field:$('field-mode').value,flow:$('flow-mode').value};
}
function makeTrajectory(p,type){
 const n=Math.max(2,Math.ceil(p.tmax*100)),pts=[];
 for(let i=0;i<=n;i++){
  const t=p.tmax*i/n;
  const th=type==='x'?wrapAngle(PI/4+p.l1*t):wrapAngle(PI/4-p.l2*t);
  const ph=type==='x'?wrapAngle(PI/4+p.l2*t):wrapAngle(PI/4+p.l1*t);
  pts.push(map(th,ph,p.k));
 }
 return pts;
}
function update(){
 const p=getParams();
 $('density-out').textContent=p.a;
 $('tmax-out').textContent=p.tmax.toFixed(1);
 buildSurface(p.k);
 clearGroup(xField);clearGroup(yField);
 disposeObject(xFlow);disposeObject(yFlow);disposeObject(xArrow);disposeObject(yArrow);
 xFlow=yFlow=xArrow=yArrow=null;
 const step=PI/p.a;
 for(let th=0;th<TAU-1e-8;th+=step){
  for(let ph=0;ph<TAU-1e-8;ph+=step){
   const pos=map(th,ph,p.k);
   if(p.field==='x'||p.field==='both')addArrow(xField,pos,fieldVector(th,ph,p.k,p.l1,p.l2,'x'),'#f05252',.2,.028);
   if(p.field==='y'||p.field==='both')addArrow(yField,pos,fieldVector(th,ph,p.k,p.l1,p.l2,'y'),'#559aff',.2,.028);
  }
 }
 const dX=fieldVector(wrapAngle(PI/4+p.l1*p.tmax),wrapAngle(PI/4+p.l2*p.tmax),p.k,p.l1,p.l2,'x');
 const dY=fieldVector(wrapAngle(PI/4-p.l2*p.tmax),wrapAngle(PI/4+p.l1*p.tmax),p.k,p.l1,p.l2,'y');
 if(p.flow==='x'||p.flow==='both'){
  xFlow=makeTube(makeTrajectory(p,'x'),'#f05252',.018);
  if(xFlow)scene.add(xFlow);
  const end=makeTrajectory(p,'x').at(-1);
  if(dX.length()>1e-8){xArrow=new THREE.ArrowHelper(dX.clone().normalize(),end,dX.length()*.3,'#f05252',.15,.075);scene.add(xArrow);}
 }
 if(p.flow==='y'||p.flow==='both'){
  yFlow=makeTube(makeTrajectory(p,'y'),'#559aff',.018);
  if(yFlow)scene.add(yFlow);
  const end=makeTrajectory(p,'y').at(-1);
  if(dY.length()>1e-8){yArrow=new THREE.ArrowHelper(dY.clone().normalize(),end,dY.length()*.3,'#559aff',.15,.075);scene.add(yArrow);}
 }
}
for(const id of ['k','density','tmax','l1','l2','field-mode','flow-mode'])$(id).addEventListener('change',update);
$('density').addEventListener('input',()=>$('density-out').textContent=$('density').value);
$('tmax').addEventListener('input',()=>$('tmax-out').textContent=Number($('tmax').value).toFixed(1));
$('reset').addEventListener('click',()=>{
 $('k').value='4';$('density').value='14';$('tmax').value='10';
 $('l1').value='1';$('l2').value='pi';$('field-mode').value='both';$('flow-mode').value='both';update();
});
$('theme').addEventListener('click',()=>{
 document.body.classList.toggle('contrast');
 const dark=document.body.classList.contains('contrast');
 $('theme').textContent=dark?'Tema claro':'Alto contraste';
 const color=dark?0x080b10:0xffffff;
 scene.background=new THREE.Color(color);renderer.setClearColor(color,1);
});
const resize=()=>{
 const w=Math.max(1,view.clientWidth),h=Math.max(1,view.clientHeight);
 camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);
};
const ro=new ResizeObserver(resize);ro.observe(view);resize();
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
update();animate();
const fs=$('fullscreen'),open=$('open');
document.addEventListener('fullscreenchange',()=>fs.textContent=document.fullscreenElement?'⤢ Sair da tela inteira':'⛶ Tela inteira');
fs.addEventListener('click',()=>{
 if(document.fullscreenElement){document.exitFullscreen?.().catch(()=>{});return;}
 if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().then(()=>open.hidden=true).catch(()=>open.hidden=false);
 else open.hidden=false;
});
if(window.self!==window.top)open.hidden=false;
open.addEventListener('click',()=>{const w=window.open(location.href,'_blank','noopener,noreferrer');if(!w)open.textContent='Pop-up bloqueado';});
window.addEventListener('error',e=>{if(e.message)error(e.message);});
window.addEventListener('unhandledrejection',e=>error(String(e.reason||'Falha desconhecida ao inicializar Three.js.')));
</script>
</body>
</html>
